<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Where to WFC">
  <title>Where to WFC</title>
  <!--
    A coffee cup in the product's cream on its moss, at the size a browser tab shows it. The same
    cup as the admin header, drawn solid rather than as an outline: a 16px favicon has one pixel
    to spend on a stroke, and an outlined cup greys out against the moss at that size.

    Two things carry the read at that size and are not decoration. The rim is what makes the shape
    a cup rather than a bag, and it is centred on the body and overlaps it, because a lip that
    floats above reads as a separate lid. The handle hangs from just under the rim where a handle
    actually is.

    The tile is deliberately full-bleed and opaque. Desktop browsers draw a favicon exactly as
    given, and iOS composites apple-touch-icon transparency onto black, so rounded corners would
    cost more than they add.

    apple-touch-icon.png (180) and favicon-32.png beside this file are this mark rendered by
    rsvg-convert. Regenerate them from here if the mark changes:

      rsvg-convert -w 180 -h 180 favicon.svg -o apple-touch-icon.png
      rsvg-convert -w 32  -h 32  favicon.svg -o favicon-32.png
  -->
  <rect width="32" height="32" fill="#294d37" />
  <g transform="translate(0.4 -0.3)" fill="#f7f5ed">
    <path d="M9.7 11.1h9.8l-1 10.3a1.7 1.7 0 0 1-1.7 1.5h-5.4a1.7 1.7 0 0 1-1.7-1.5Z" />
    <path d="M19.5 12.9h1.3a3.3 3.3 0 0 1 0 6.6h-1.3" fill="none" stroke="#f7f5ed" stroke-width="1.9" stroke-linecap="round" />
    <rect x="7.6" y="9.1" width="14" height="2.2" rx="1.1" />
  </g>
</svg>
